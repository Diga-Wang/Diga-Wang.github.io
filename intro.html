<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>人间样本 · 站点已迁移</title>
<meta http-equiv="refresh" content="2;url=https://human-samples.github.io/">
<link rel="canonical" href="https://human-samples.github.io/">
<style>
  :root{--navy:#12233b;--amber:#d99a2b;--ink:#1c2b3e;--muted:#6b7a8c;--paper:#f7f4ee}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--paper);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       padding:24px;line-height:1.7}
  .card{max-width:520px;width:100%;background:#fff;border:1px solid #e6e0d4;
        border-top:4px solid var(--amber);border-radius:10px;padding:36px 34px;
        box-shadow:0 8px 30px rgba(18,35,59,.07)}
  .brand{font-size:13px;letter-spacing:.18em;color:var(--amber);font-weight:700;margin-bottom:14px}
  h1{font-size:24px;margin:0 0 12px;color:var(--navy);letter-spacing:.02em}
  p{margin:0 0 10px;color:var(--muted);font-size:15px}
  .btn{display:inline-block;margin-top:22px;padding:12px 26px;background:var(--navy);
       color:#fff;text-decoration:none;border-radius:6px;font-size:15px;font-weight:600}
  .btn:hover{background:#1d3a5f}
  .url{margin-top:20px;font-size:12px;color:#93a0ae;word-break:break-all}
  code{background:#f2efe8;padding:2px 6px;border-radius:3px;color:var(--navy)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">RENJIAN SAMPLES</div>
    <h1>站点已迁移</h1>
    <p>人间样本已搬到新地址，正在为你跳转。</p>
    <p>如果 2 秒后没有自动打开，请点下面的按钮。</p>
    <a class="btn" href="https://human-samples.github.io/">立即进入人间样本 →</a>
    <div class="url">新地址：<code>https://human-samples.github.io/</code></div>
  </div>
  <script>
    var TARGET = 'https://human-samples.github.io/';
    setTimeout(function(){ location.replace(TARGET); }, 1600);
  </script>
</body>
</html>
